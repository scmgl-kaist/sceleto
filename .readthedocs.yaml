version: 2

build:
  os: ubuntu-24.04
  # nbsphinx converts the tutorial notebooks via pandoc, which is NOT preinstalled
  # on the ubuntu-24.04 image — declare it so notebook pages build reliably.
  apt_packages:
    - pandoc
  tools:
    python: "3.11"

sphinx:
  configuration: docs/conf.py

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - all
    - requirements: docs/requirements.txt
